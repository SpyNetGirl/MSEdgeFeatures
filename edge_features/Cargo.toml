[package]
name = "edge_features"
version = "0.1.0"
edition = "2024"
authors = ["Violet Hansen"]
license = "MIT"
repository = "https://github.com/SpyNetGirl/MSEdgeFeatures"
documentation = "https://github.com/SpyNetGirl/MSEdgeFeatures"
publish = false
rust-version = "1.99"

[dependencies]
serde = { version = "*", features = ["derive"] }
serde_json = "*"
anyhow = "*"
regex = "*"
chrono = { version = "*", features = ["serde"] }
walkdir = "*"
winreg = "*"

[profile.release]
codegen-units = 1
opt-level = "s"
split-debuginfo = "packed"
strip = "symbols"
lto = "fat"
incremental = false
panic = "unwind"
